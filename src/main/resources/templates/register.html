<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
>
<head>
    <meta charset="UTF-8">
    <title>Registration and Login System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body>

<script>
    document.getElementById('expire_date').addEventListener('change', function(event) {
        let dateInput = event.target.value;
        let date = new Date(dateInput);

        // Convert to EST (UTC-5)
        let estDate = new Date(date.toLocaleString('en-US', { timeZone: 'America/New_York' }));

        console.log('Original Date:', date);
        console.log('EST Date:', estDate);

        // Format the EST date back to YYYY-MM-DD
        let year = estDate.getFullYear();
        let month = ('0' + (estDate.getMonth() + 1)).slice(-2);
        let day = ('0' + estDate.getDate()).slice(-2);

        // Update the input field with the EST date
        event.target.value = `${year}-${month}-${day}`;
    });
</script>



<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top" th:fragment="header">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/}">Registration and Login System</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
    </div>
</nav>
<br />
<br />
<br />
<div class="container">
    <div class="row col-md-8 offset-md-2">
        <div class="card">
            <div th:if="${param.success}">
                <div class="alert alert-info">You've successfully registered
                    to our app!</div>
            </div>
            <div class="card-header">
                <h2 class="text-center">Registration</h2>
            </div>
            <div class="card-body">
                <form method="post" role="form" th:action="@{/register/save}" th:object="${user}">

                    <div class="form-group mb-3">
                        <label class="form-label">First Name</label>
                        <input class="form-control"
                               id="firstName"
                               name="firstName"
                               placeholder="Enter first name"
                               th:field="*{firstName}"
                               type="text"
                        />
                        <p th:errors="*{firstName}" class="text-danger"
                           th:if="${#fields.hasErrors('firstName')}">
                        </p>
                    </div>

                    <div class="form-group mb-3">
                        <label class="form-label">Last Name</label>
                        <input class="form-control"
                               id="lastName"
                               name="lastName"
                               placeholder="Enter last name"
                               th:field="*{lastName}"
                               type="text"
                        />
                        <p th:errors="*{lastName}" class="text-danger"
                           th:if="${#fields.hasErrors('lastName')}">
                        </p>
                    </div>
                    <div class="form-group mb-3">
                        <label class="form-label">Email</label>
                        <input class="form-control"
                               id="email"
                               name="email"
                               placeholder="Enter email address"
                               th:field="*{email}"
                               type="email"
                        />
                        <p th:errors="*{email}" class="text-danger"
                           th:if="${#fields.hasErrors('email')}">
                        </p>
                    </div>
                    <div class="form-group mb-3">
                        <label class="form-label">Password</label>
                        <input class="form-control"
                               id="password"
                               name="password"
                               placeholder="Enter password"
                               th:field="*{password}"
                               type="password"
                        />
                        <p th:errors="*{password}" class="text-danger"
                           th:if="${#fields.hasErrors('password')}">
                        </p>
                    </div>


                    <div class="form-group mb-3">
                        <label class="form-label">expire date</label>
                        <input class="form-control"
                               id="expiredate"
                               name="expiredate"
                               placeholder="Enter Expire Date"
                               th:field="*{expiredate}"
                               type="date"
                               />
                               <!-- pattern="\d{4}-\d{2}-\d{2}" -->

                        <p th:errors="*{expiredate}" class="text-danger"
                           th:if="${#fields.hasErrors('expiredate')}">
                        </p>
                    </div>


<!--
                    <div class="form-group mb-3">
                        <label class="form-label">expire date</label>
                        <input class="form-control"
                               id="expire_date"
                               name="expire_date"
                               placeholder="Enter Expire Date"
                               th:field="*{expire_date}"
                               type="date"
                        />
                        <p th:errors="*{expire_date}" class="text-danger"
                           th:if="${#fields.hasErrors('expire_date')}">
                        </p>
                    </div>
-->
                    <div class="form-group mb-3">
                        <label class="form-label">Role</label>
                        <input class="form-control"
                               id="role_name"
                               name="role_name"
                               placeholder="Enter Role address"
                               th:field="*{role_name}"
                               type="text"
                        />
                        <p th:errors="*{role_name}" class="text-danger" th:if="${#fields.hasErrors('role_name')}"></p>
                    </div>

                    <div class="form-group mb-3">
                        <button class="btn btn-primary" type="submit">Register</button>
                        <span>Already registered? <a href="/" th:href="@{/login}">Login
                             here</a></span>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
