<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Role Management</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 p-6">
<div class="container mx-auto">
    <h1 class="text-2xl font-bold mb-4">Role Management</h1>

    <!-- Form for Adding/Updating Roles -->
    <form th:action="@{/admin/role}" th:object="${role}" method="post" class="bg-white p-6 rounded shadow-md mb-6">
        <input type="hidden" th:field="*{id}" />
        <div class="mb-4">
            <label class="block text-gray-700">Role Name</label>
            <input type="text" th:field="*{name}" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm" required />
        </div>
        <div class="flex justify-end">
            <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded">Save</button>
        </div>
    </form>

    <!-- List of Roles -->
    <div class="bg-white p-6 rounded shadow-md">
        <h2 class="text-xl font-bold mb-4">Roles</h2>
        <table class="min-w-full bg-white">
            <thead>
            <tr>
                <th class="py-2">ID</th>
                <th class="py-2">Name</th>
                <th class="py-2">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="role : ${roles}">
                <td class="border px-4 py-2" th:text="${role.id}"></td>
                <td class="border px-4 py-2" th:text="${role.name}"></td>
                <td class="border px-4 py-2">
                    <a th:href="@{/admin/role/{id}(id=${role.id})}" class="text-blue-500">Edit</a>
                    <form th:action="@{/admin/role/delete/{id}(id=${role.id})}" method="post" class="inline">
                        <input type="hidden" name="_method" value="delete" />
                        <button type="submit" class="text-red-500 ml-2">Delete</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
